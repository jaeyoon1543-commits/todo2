<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>오늘 해야 할 일</h1>
    <input type="text" placeholder="할 일을 입력하세요" aria-label="할 일">
    <button type="button">추가</button>
    <ul></ul>
    <p id="message" role="status" hidden></p>
    <button type="button" id="server-check">서버 확인</button>
    <p id="server-message" role="status" hidden></p>
    <script src="script.js"></script>
</body>
</html>
